{% extends "base.html" %}
{% block content %}
<section class="hero is-primary is-medium mb-5">
    <div class="hero-body">
        <h1 class="title">Bienvenido al Ranking Oficial</h1>
        <p class="subtitle">Gestiona tus jugadores y partidas como un profesional.</p>
    </div>
</section>
<h2 class="title">Top Jugadores</h2>
<table class="table is-fullwidth is-striped">
    <thead><tr><th>Pos</th><th>Nombre</th><th>Puntos</th></tr></thead>
    <tbody>
        {% for r in ranking %}
        <tr>
            <td>{{ loop.index }}</td>
            <td>{{ r.nombre }}</td>
            <td>{{ r.puntos }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
