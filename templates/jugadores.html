<{% extends "base.html" %}
{% block content %}
<h1 class="title">Lista de Jugadores</h1>
<div class="columns is-multiline">
    {% for j in jugadores %}
    <div class="column is-one-quarter">
        <div class="card">
            <div class="card-image"><figure class="image is-4by3"><img src="{{ j.foto_url }}"></figure></div>
            <div class="card-content">
                <p class="title is-4">{{ j.nombre }}</p>
                <div class="content">
                    País: {{ j.pais }} <br>
                    Estado: {% if j.activo %}<span class="tag is-success">Activo</span>{% else %}<span class="tag is-danger">Inactivo</span>{% endif %}
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
<a href="/jugadores/nuevo" class="button is-primary mt-5">+ Nuevo Jugador</a>
{% endblock %}
