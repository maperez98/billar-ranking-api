{% extends "base.html" %}
{% block content %}
<h1 class="title">Nuestros Jugadores</h1>
<a href="/jugadores/nuevo" class="button is-primary mb-5"><i class="fas fa-plus"></i> &nbsp; Nuevo Jugador</a>

<div class="columns is-multiline">
    {% for j in jugadores %}
    <div class="column is-one-quarter">
        <div class="card">
            <div class="card-image">
                <figure class="image is-4by3">
                    <img src="{{ j.foto_url }}" alt="Foto de {{ j.nombre }}">
                </figure>
            </div>
            <div class="card-content">
                <p class="title is-4">{{ j.nombre }}</p>
                <p class="subtitle is-6">{{ j.pais }} | Nivel: {{ j.nivel }}</p>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
