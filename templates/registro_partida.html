{% extends "base.html" %}
{% block content %}
<div class="box" style="max-width: 500px; margin: 0 auto;">
    <h1 class="title">Registrar Partida</h1>
    <form action="/partidas" method="post">
        <div class="field">
            <label class="label">Jugador 1</label>
            <div class="select is-fullwidth"><select name="jugador1_id">
                {% for j in jugadores %}<option value="{{ j.id }}">{{ j.nombre }}</option>{% endfor %}
            </select></div>
        </div>
        <div class="field">
            <label class="label">Jugador 2</label>
            <div class="select is-fullwidth"><select name="jugador2_id">
                {% for j in jugadores %}<option value="{{ j.id }}">{{ j.nombre }}</option>{% endfor %}
            </select></div>
        </div>
        <div class="field">
            <label class="label">Ganador</label>
            <div class="select is-fullwidth"><select name="ganador_id">
                {% for j in jugadores %}<option value="{{ j.id }}">{{ j.nombre }}</option>{% endfor %}
            </select></div>
        </div>
        <button type="submit" class="button is-success is-fullwidth mt-4">Guardar Resultado</button>
    </form>
</div>
{% endblock %}
