{% extends "base.html" %}
{% block content %}
<div class="box" style="max-width: 600px; margin: 0 auto;">
    <h1 class="title has-text-centered">Registrar Nueva Partida</h1>

    <form action="/partidas" method="post">
        <div class="field">
            <label class="label">Jugador 1</label>
            <div class="control">
                <div class="select is-fullwidth">
                    <select name="jugador1_id" required>
                        {% for j in jugadores %}
                        <option value="{{ j.id }}">{{ j.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>

        <div class="field">
            <label class="label">Jugador 2</label>
            <div class="control">
                <div class="select is-fullwidth">
                    <select name="jugador2_id" required>
                        {% for j in jugadores %}
                        <option value="{{ j.id }}">{{ j.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>

        <div class="field">
            <label class="label">Ganador de la partida</label>
            <div class="control">
                <div class="select is-fullwidth">
                    <select name="ganador_id" required>
                        {% for j in jugadores %}
                        <option value="{{ j.id }}">{{ j.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>

        <div class="field is-grouped mt-5">
            <div class="control">
                <button type="submit" class="button is-success is-medium">Registrar Partida</button>
            </div>
            <div class="control">
                <a href="/partidas-pagina" class="button is-light is-medium">Cancelar</a>
            </div>
        </div>
    </form>
</div>
{% endblock %}
