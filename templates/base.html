<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Billar Pro | Sistema de Ranking</title>
</head>
<body>
    <nav class="navbar is-dark">
        <div class="navbar-brand">
            <a class="navbar-item" href="/"><strong><i class="fas fa-pool-8-ball"></i> BILLAR PRO</strong></a>
        </div>
        <div class="navbar-menu">
            <div class="navbar-start">
                <a class="navbar-item" href="/ranking">Ranking</a>
                <a class="navbar-item" href="/jugadores-pagina">Jugadores</a>
                <a class="navbar-item" href="/partidas-pagina">Partidas</a>
            </div>
            <div class="navbar-end">
                <div class="navbar-item">
                    <form action="/jugadores/buscar/nombre" method="get">
                        <div class="field has-addons">
                            <input class="input" type="text" name="nombre" placeholder="Buscar jugador...">
                            <button class="button is-info">Buscar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </nav>
    <section class="section">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </section>
</body>
</html>
