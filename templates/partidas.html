{% extends "base.html" %}
{% block content %}
<h1 class="title">Gestión de Partidas</h1>
<table class="table is-fullwidth">
    <thead><tr><th>Jugador 1</th><th>Jugador 2</th><th>Ganador</th></tr></thead>
    <tbody>
        {% for p in partidas %}
        <tr>
            <td>{{ p.jugador1_id }}</td>
            <td>{{ p.jugador2_id }}</td>
            <td>{{ p.ganador_id }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
