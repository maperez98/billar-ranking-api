{% extends "base.html" %}
{% block title %}Nuevo Jugador — Billar Pro{% endblock %}

{% block content %}
<div class="columns is-centered">
    <div class="column is-6">
        <div class="card">
            <div class="card-content">
                <p class="title is-4">
                    <span class="icon"><i class="fas fa-user-plus"></i></span> Registrar Jugador
                </p>

                {% if error %}
                <div class="notification is-danger">{{ error }}</div>
                {% endif %}

                <form method="post" action="/jugadores/con-foto" enctype="multipart/form-data">
                    <div class="field">
                        <label class="label">Nombre *</label>
                        <div class="control">
                            <input class="input" type="text" name="nombre"
                                   placeholder="Ej: Carlos Rodríguez" required minlength="2" maxlength="50">
                        </div>
                    </div>

                    <div class="columns">
                        <div class="column">
                            <div class="field">
                                <label class="label">Edad *</label>
                                <div class="control">
                                    <input class="input" type="number" name="edad"
                                           placeholder="18-100" min="18" max="100" required>
                                </div>
                            </div>
                        </div>
                        <div class="column">
                            <div class="field">
                                <label class="label">País *</label>
                                <div class="control">
                                    <div class="select is-fullwidth">
                                        <select name="pais" required>
                                            <option value="" disabled selected>Selecciona un país</option>
                                            <option value="Argentina">Argentina</option>
                                            <option value="Bolivia">Bolivia</option>
                                            <option value="Brasil">Brasil</option>
                                            <option value="Chile">Chile</option>
                                            <option value="Colombia">Colombia</option>
                                            <option value="Costa Rica">Costa Rica</option>
                                            <option value="Cuba">Cuba</option>
                                            <option value="Ecuador">Ecuador</option>
                                            <option value="El Salvador">El Salvador</option>
                                            <option value="Guatemala">Guatemala</option>
                                            <option value="Honduras">Honduras</option>
                                            <option value="Mexico">Mexico</option>
                                            <option value="Nicaragua">Nicaragua</option>
                                            <option value="Panama">Panama</option>
                                            <option value="Paraguay">Paraguay</option>
                                            <option value="Peru">Peru</option>
                                            <option value="Puerto Rico">Puerto Rico</option>
                                            <option value="Republica Dominicana">Republica Dominicana</option>
                                            <option value="Uruguay">Uruguay</option>
                                            <option value="Venezuela">Venezuela</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Nivel *</label>
                        <div class="control">
                            <div class="select is-fullwidth">
                                <select name="nivel" required>
                                    <option value="" disabled selected>Selecciona un nivel</option>
                                    <option value="principiante">🟢 Principiante</option>
                                    <option value="intermedio">🔵 Intermedio</option>
                                    <option value="profesional">🔴 Profesional</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Foto del jugador</label>
                        <div class="control">
                            <input class="input" type="file" name="foto"
                                   accept="image/jpeg,image/png,image/webp">
                        </div>
                        <p class="help">Formatos: JPG, PNG, WEBP</p>
                    </div>

                    <div class="field is-grouped is-grouped-right mt-4">
                        <div class="control">
                            <a href="/jugadores-pagina" class="button is-light">Cancelar</a>
                        </div>
                        <div class="control">
                            <button type="submit" class="button btn-billar">
                                <span class="icon"><i class="fas fa-check"></i></span>
                                <span>Registrar</span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
